[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tiktok-transcript"
version = "0.1.0"
description = "Extract the transcript of a TikTok user's latest video via native captions."
requires-python = ">=3.10"
dependencies = [
    "curl_cffi>=0.7.0",
    "yt-dlp>=2026.1.0",
]

[project.optional-dependencies]
whisper = [
    "faster-whisper>=1.0.0",
]

[project.scripts]
tiktok-transcript = "tiktok_transcript.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["tiktok_transcript"]
